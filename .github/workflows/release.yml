name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate stable release tag
        run: sh scripts/validate-release-tag.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: Render deterministic release notes
        run: |
          set -eu
          version=${GITHUB_REF_NAME#v}
          sh scripts/release-notes.sh render "$version" >release-notes.md
      - uses: actions/upload-artifact@v5
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build:
    needs: validate
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            builder: cargo
          - target: x86_64-apple-darwin
            os: macos-14
            builder: cargo
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            builder: cross
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            builder: cross
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.builder == 'cross'
        run: cargo install cross --locked --version 0.2.5
      - if: matrix.builder == 'cargo'
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - if: matrix.builder == 'cross'
        run: cross build --release --locked --target "${{ matrix.target }}"
      - if: matrix.builder == 'cross'
        run: sh scripts/verify-glibc-baseline.sh "target/${{ matrix.target }}/release/herdr-agent-context" 2.18
      - name: Package
        run: |
          set -eu
          version=${GITHUB_REF_NAME#v}
          sh scripts/verify-version.sh "$GITHUB_REF_NAME"
          binary="target/${{ matrix.target }}/release/herdr-agent-context"
          strip "$binary" || true
          stage="dist/${{ matrix.target }}"
          mkdir -p "$stage"
          cp "$binary" "$stage/herdr-agent-context"
          cp LICENSE "$stage/LICENSE"
          tar -czf "dist/herdr-agent-context-v${version}-${{ matrix.target }}.tar.gz" -C "$stage" herdr-agent-context LICENSE
      - uses: actions/upload-artifact@v5
        with:
          name: herdr-agent-context-${{ matrix.target }}
          path: dist/herdr-agent-context-v*.tar.gz
          if-no-files-found: error

  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: herdr-agent-context-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v5
        with:
          name: release-notes
          path: .
      - name: Verify assets
        run: |
          set -eu
          version=${GITHUB_REF_NAME#v}
          (cd dist && sha256sum herdr-agent-context-v*.tar.gz | LC_ALL=C sort -k2 >SHA256SUMS)
          sh scripts/verify-version.sh "$GITHUB_REF_NAME"
          sh scripts/verify-release-assets.sh "$version" dist
      - name: Smoke-test release installer
        run: |
          set -eu
          install_root=$(mktemp -d)
          expected=$(mktemp -d)
          trap 'rm -rf "$install_root" "$expected"' EXIT
          HERDR_AGENT_CONTEXT_OS=Linux \
          HERDR_AGENT_CONTEXT_ARCH=x86_64 \
          HERDR_AGENT_CONTEXT_BASE_URL="file://$PWD/dist" \
          HERDR_AGENT_CONTEXT_INSTALL_ROOT="$install_root" \
          sh scripts/install-binary.sh
          tar -xzf "dist/herdr-agent-context-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz" \
            -C "$expected" herdr-agent-context
          test -x "$install_root/bin/herdr-agent-context"
          cmp "$expected/herdr-agent-context" "$install_root/bin/herdr-agent-context"
      - name: Publish or verify stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version=${GITHUB_REF_NAME#v}
          decision=$(sh scripts/check-github-release.sh "$version" release-notes.md "$GITHUB_REPOSITORY")
          case "$decision" in
            existing)
              exit 0
              ;;
            absent)
              ;;
            *)
              echo "unexpected GitHub Release decision: $decision" >&2
              exit 1
              ;;
          esac

          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --latest \
            "dist/herdr-agent-context-v${version}-aarch64-apple-darwin.tar.gz" \
            "dist/herdr-agent-context-v${version}-x86_64-apple-darwin.tar.gz" \
            "dist/herdr-agent-context-v${version}-aarch64-unknown-linux-gnu.tar.gz" \
            "dist/herdr-agent-context-v${version}-x86_64-unknown-linux-gnu.tar.gz" \
            dist/SHA256SUMS

          decision=$(sh scripts/check-github-release.sh "$version" release-notes.md "$GITHUB_REPOSITORY")
          case "$decision" in
            existing)
              ;;
            absent)
              echo "GitHub Release remains absent after creation" >&2
              exit 1
              ;;
            *)
              echo "unexpected GitHub Release decision after creation: $decision" >&2
              exit 1
              ;;
          esac
