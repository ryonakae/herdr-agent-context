[package]
name = "herdr-agent-context"
version = "0.5.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/ryonakae/herdr-agent-context"
description = "Herdr metadata listener for coding-agent session context"
rust-version = "1.85"

[dependencies]
libc = "0.2"
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
toml = "0.9"
unicode-segmentation = "1.12"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3.20"
